# #185: Weder Host-Ports noch Containernamen stehen hier noch fest.
#
# Die Ports folgen jetzt der Form, die diese Datei ohnehin ueberall verwendet
# ("${...:-...}"): Sie waren die Ausnahme von der Regel der Datei, nicht ihr
# Muster. Ohne sie liess sich das Buendel auf einem Rechner, auf dem 80 oder
# 5432 belegt sind, ueberhaupt nicht starten - und der naheliegende Ausweg
# ueber eine Override-Datei half nicht: Compose FUEHRT zwei Portlisten
# ZUSAMMEN, statt die eine durch die andere zu ersetzen, und band die
# urspruenglichen Ports zusaetzlich. Erst das YAML-Merkmal "!override" half,
# und das steht in keiner Anleitung.
#
# "container_name" ist ersatzlos entfallen. Ein solcher Name gilt je
# Docker-Dienst, nicht je Compose-Projekt: Ein zweites Buendel auf demselben
# Rechner - ein Probeaufbau neben dem laufenden Fest - scheiterte daran auch
# bei voellig freien Ports, und COMPOSE_PROJECT_NAME blieb wirkungslos. Ohne
# die Zeile bildet Compose die Namen aus Projekt- und Dienstnamen; beides
# wirkt wieder. Angesprochen werden die Container ueber ihren DIENSTnamen
# ("docker compose logs backend", "docker compose exec backend ..."), der von
# alledem unberuehrt bleibt - ebenso wie die Netzwerknamen, ueber die sich die
# Dienste untereinander finden (BACKEND_URL=http://backend:3000).
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vereinorder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backup_data:/backups
    # #181: Nur auf die Loopback-Adresse des Hosts binden, nicht auf allen
    # Schnittstellen. Im Festbetrieb haengt der Rechner im selben Netz wie die
    # Bediengeraete; ein offenes oder mit Gaesten geteiltes WLAN machte die
    # Datenbank sonst an der Anwendung, ihren Guards und ihrem Audit-Log
    # vorbei direkt ansprechbar. Der ersatzlose Wegfall waere sicherer
    # gewesen, haette aber den Notfall-Wiederherstellungsweg
    # (scripts/ops/restore.sh, docs/ops/backup-recovery.md Abschnitt 4)
    # umschreiben muessen - ein Verfahren, das im Ernstfall unter Druck
    # ablaeuft, aendert man nicht ohne Not. Auf dem Server selbst bleiben
    # beide dokumentierten Wege unveraendert erreichbar; vom Laptop aus
    # braucht ein Datenbankwerkzeug jetzt einen SSH-Tunnel.
    ports:
      # Die Bindung an 127.0.0.1 ist NICHT steuerbar und bleibt fest: Sie ist
      # die Entscheidung aus #181, nicht eine Vorgabe. Variabel ist allein der
      # Host-Port.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # #200: Fertiges Abbild aus der Registry - und ZUSAETZLICH weiterhin
    # "build:". Beides zusammen ist der ganze Kniff:
    #
    #   - Auf dem Raspberry Pi wird aus einer Aktualisierung
    #     "docker compose pull" statt eines vollstaendigen Baus. Vorher zwang
    #     jede Aktualisierung das Geraet, das gleichzeitig Bestellungen bedient,
    #     zu bis zu sechs "pnpm install"-Laeufen - mit erreichbarer
    #     npm-Registry als Voraussetzung. Die CI hatte dieselben Abbilder
    #     laengst gebaut und danach weggeworfen.
    #   - In Entwicklung und CI aendert sich nichts: Fehlt das Abbild oertlich,
    #     BAUT "docker compose up -d" es weiterhin selbst; gezogen wird nur auf
    #     ausdrueckliches "docker compose pull". Wer an der Anwendung arbeitet,
    #     nimmt wie bisher "--build".
    #
    # VEREINORDER_VERSION pinnt eine bestimmte Fassung (Commit-SHA); ohne
    # Angabe gilt "latest", also der letzte gruene Stand von "main".
    #
    # #243: "mku-solution" hier bewusst klein geschrieben, obwohl die
    # Organisation auf GitHub "MKU-Solution" heisst (Repository-Adressen wie
    # https://github.com/MKU-Solution/VereinOrder tragen die Grossbuchstaben
    # weiterhin). Der Pfadanteil einer Docker-Abbildkennung MUSS durchgehend
    # klein geschrieben sein - das ist keine Nachlaessigkeit, die sich
    # spaeter "vereinheitlichen" liesse, sondern von ghcr.io erzwungen.
    image: ghcr.io/mku-solution/vereinorder-backend:${VEREINORDER_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vereinorder}?schema=public
      # #175: Kein Vorgabewert mehr - der alte stand im oeffentlichen
      # Repository, und wer ihn kannte, konnte sich ein Token fuer jede Rolle
      # selbst ausstellen. Kein "${...:?}" mehr fuer das Worker-Token: leer
      # ist der Normalfall. Beide Werte erzeugt der Entrypoint beim ersten
      # Start unter STATE_DIR (apps/backend/docker-entrypoint.sh). Wer sie
      # selbst verwalten will, setzt sie in der .env - eine gesetzte
      # Umgebungsvariable gewinnt immer.
      JWT_SECRET: ${JWT_SECRET:-}
      PRINT_WORKER_TOKEN: ${PRINT_WORKER_TOKEN:-}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_HOURLY_KEEP: ${BACKUP_RETENTION_HOURLY_KEEP:-24}
      BACKUP_RETENTION_DAILY_KEEP: ${BACKUP_RETENTION_DAILY_KEEP:-14}
      BACKUP_RETENTION_EVENT_KEEP: ${BACKUP_RETENTION_EVENT_KEEP:-3}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-1073741824}
      # Nach einer erfolgreichen Datenbankumschaltung beendet sich das
      # Backend kontrolliert; restart: always startet es gegen der neuen
      # Datenbank wieder im weiterhin gesperrten Wartungsmodus.
      RESTORE_EXIT_AFTER_SWAP: "1"
      # Wartungsmodus (#67): Der Zustand liegt bewusst ausserhalb der
      # Datenbank, weil eine Wiederherstellung die Datenbank ersetzt - ein
      # Feld darin wuerde im gefaehrlichsten Augenblick ueberschrieben. Das
      # eigene Volume sorgt dafuer, dass der Zustand auch ein Neuanlegen des
      # Containers ueberlebt: ein Backend, das waehrend einer Wartung neu
      # aufgesetzt wird, kommt geschlossen wieder hoch, nicht offen.
      STATE_DIR: /app/state
      PORT: 3000
    volumes:
      - backup_data:/app/backups
      - state_data:/app/state
    ports:
      # Nur der HOST-Port ist variabel. Der Containerport bleibt 3000, weil
      # ihn ausser der Abbildung hier auch der healthcheck unten und
      # BACKEND_URL des Print-Workers kennen muessen.
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # #184: Bis hierher meldete ausser postgres kein Dienst einen Zustand.
    # GET /health antwortet unangemeldet und prueft dabei bis auf das Schema
    # durch (apps/backend/src/health/health.service.ts) - ein blosses
    # "Prozess laeuft" haette den Zustand aus #172 als gesund gemeldet.
    #
    # "wget" kommt aus BusyBox und ist in node:20-alpine enthalten; ein
    # zusaetzliches Paket braucht diese Pruefung nicht. "--spider" waere der
    # naheliegende Schalter, verschickt bei BusyBox aber ein HEAD, und der
    # Weg beantwortet GET - deshalb "-O /dev/null".
    #
    # start_period grosszuegig: Der Entrypoint fuehrt vor dem Anwendungsstart
    # "prisma migrate deploy" aus (#172). Auf einem Raspberry Pi dauert die
    # erste Migration ueber 35 Schritte spuerbar laenger als auf einem
    # Entwicklungsrechner. Waehrend start_period zaehlen fehlgeschlagene
    # Versuche nicht gegen "retries" - anders als im Umfang von #184
    # angenommen fuehrt eine fehlgeschlagene Pruefung ohnehin zu KEINEM
    # Neustart: "restart: always" reagiert auf das Ende des Prozesses, nicht
    # auf den Gesundheitszustand (das tut nur Docker Swarm). Der grosszuegige
    # Wert verhindert also keine Neustartschleife, sondern eine irrefuehrende
    # Anzeige "unhealthy" waehrend eines voellig regulaeren ersten Starts.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  frontend:
    # Siehe die Begruendung beim Dienst "backend" (#200).
    image: ghcr.io/mku-solution/vereinorder-frontend:${VEREINORDER_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: always
    # #180: Am Host unveraendert Port 80, im Container 8080. Der
    # nginx-Hauptprozess laeuft seit #180 unprivilegiert und kann keinen
    # Port unterhalb von 1024 mehr binden (apps/frontend/nginx.conf,
    # apps/frontend/Dockerfile). Fuer den Betrieb aendert sich dadurch
    # nichts: Die Anwendung bleibt unter http://<SERVER-IP>/ erreichbar.
    # Seit #185 ist der Host-Port ueber FRONTEND_PORT steuerbar; 80 ist nur
    # noch die Vorgabe.
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    # #184: "depends_on" bleibt hier bewusst OHNE "condition: service_healthy",
    # abweichend vom Wortlaut des Umfangs. Das Frontend ist ein statischer
    # Dateiserver; zum Ausliefern der Oberflaeche braucht es das Backend
    # nicht. Wartete es auf ein GESUNDES Backend, lieferte der Server bei
    # einem Kaltstart mit kaputter Datenbank ueberhaupt keine Seite aus -
    # ausgerechnet in dem Augenblick, in dem jemand am Geraet nachsehen will,
    # was los ist. Ein Backend, das nicht antwortet, ergibt so ein 502 im
    # Browser statt einer toten Adresse.
    depends_on:
      - backend
    # Eigener Healthcheck trotzdem: Er beantwortet "liefert nginx aus?" in
    # "docker compose ps" und in der CI. Jeder Pfad ist zulaessig, weil
    # nginx.conf ueber "try_files" alles mit index.html beantwortet.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  print-worker:
    # Siehe die Begruendung beim Dienst "backend" (#200).
    image: ghcr.io/mku-solution/vereinorder-print-worker:${VEREINORDER_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/print-worker/Dockerfile
    restart: always
    environment:
      BACKEND_URL: http://backend:3000
      # #175: Leer erlaubt. Ist nichts gesetzt, liest der Worker das vom
      # Backend erzeugte Token aus STATE_DIR (siehe volumes unten). Fehlt die
      # Datei noch - der Worker startet parallel zum Backend -, endet er mit
      # Fehlerstatus und laeuft ueber "restart: always" erneut an.
      PRINT_WORKER_TOKEN: ${PRINT_WORKER_TOKEN:-}
      PRINT_FORCE_SIMULATOR: ${PRINT_FORCE_SIMULATOR:-0}
      PRINT_POLL_INTERVAL_MS: ${PRINT_POLL_INTERVAL_MS:-2500}
      PRINT_TIMEOUT_MS: ${PRINT_TIMEOUT_MS:-5000}
      CUPS_BASE_URL: ${CUPS_BASE_URL:-http://host.docker.internal:631}
      PRINT_CUPS_POLL_MS: ${PRINT_CUPS_POLL_MS:-1000}
      PRINT_CUPS_WAIT_MS: ${PRINT_CUPS_WAIT_MS:-120000}
      STATE_DIR: /app/state
    volumes:
      # Nur lesend: Der Worker verwendet das vom Backend erzeugte Token, er
      # erzeugt keines. Zwei unabhaengig erzeugte Token waeren zwei
      # verschiedene, und der PrintWorkerGuard wuerde jede Anfrage ablehnen.
      - state_data:/app/state:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # #184: Hier ist "service_healthy" der ganze Punkt. Vorher wartete der
    # Worker nur darauf, dass der Backend-CONTAINER gestartet wurde, und lief
    # damit zwangslaeufig ins Leere: Sein Protokoll war von der ersten Sekunde
    # an voll mit "backend.claim_failed" (connect ECONNREFUSED), bis das
    # Backend lauschte. Nebenbei erledigt sich damit auch der zweite
    # Startfehler - der Worker liest sein Token aus STATE_DIR, und die Datei
    # legt der Entrypoint des Backends an, bevor die Anwendung lauscht.
    depends_on:
      backend:
        condition: service_healthy

# #185: Auch die Volumenamen sind Vorgaben statt Festlegungen - aus einem
# Grund, der beim Nachpruefen zutage kam und schwerer wiegt als die Ports.
#
# Ein "name:" gilt, genau wie ein "container_name", je Docker-Dienst und nicht
# je Compose-Projekt. Mit den entfallenen Containernamen startet ein zweites
# Buendel unter eigenem Projektnamen jetzt anstandslos - und haengt dabei
# STILLSCHWEIGEND dieselben Volumes ein. Gemessen: Ein zweiter
# PostgreSQL-Server nahm dasselbe Datenverzeichnis in Betrieb, fuehrte darauf
# eine Wiederherstellung aus ("redo starts at ...") und meldete sich als
# bereit, waehrend der erste noch lief. Die Sperrdatei "postmaster.pid"
# verhindert das NICHT: Jeder Container hat seinen eigenen PID-Namensraum, der
# zweite Server findet die eingetragene Prozessnummer bei sich nicht, haelt
# die Sperre fuer verwaist und raeumt sie weg.
#
# Der fruehere feste "container_name" hat diesen Fall zufaellig verhindert,
# indem das zweite Buendel schon am Namen scheiterte. Mit seinem Wegfall
# braucht es diese Zeilen hier, sonst waere aus einem lauten Fehlschlag ein
# leiser Datenverlust geworden.
#
# Die Vorgaben bleiben WOERTLICH die bisherigen: Eine bestehende Installation
# findet ihre Volumes unveraendert wieder, und der Notfallweg in
# docs/ops/backup-recovery.md ("docker volume inspect vereinorder_backup_data")
# bleibt gueltig. Wer ein zweites Buendel fahren will, setzt alle drei Namen -
# siehe docs/ops/installation.md.
volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-vereinorder_postgres_data}
  backup_data:
    name: ${BACKUP_DATA_VOLUME:-vereinorder_backup_data}
  state_data:
    name: ${STATE_DATA_VOLUME:-vereinorder_state_data}
