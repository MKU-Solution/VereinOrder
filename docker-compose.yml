services:
  postgres:
    image: postgres:16-alpine
    container_name: vereinorder_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vereinorder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backup_data:/backups
    # #181: Nur auf die Loopback-Adresse des Hosts binden, nicht auf allen
    # Schnittstellen. Im Festbetrieb haengt der Rechner im selben Netz wie die
    # Bediengeraete; ein offenes oder mit Gaesten geteiltes WLAN machte die
    # Datenbank sonst an der Anwendung, ihren Guards und ihrem Audit-Log
    # vorbei direkt ansprechbar. Der ersatzlose Wegfall waere sicherer
    # gewesen, haette aber den Notfall-Wiederherstellungsweg
    # (scripts/ops/restore.sh, docs/ops/backup-recovery.md Abschnitt 4)
    # umschreiben muessen - ein Verfahren, das im Ernstfall unter Druck
    # ablaeuft, aendert man nicht ohne Not. Auf dem Server selbst bleiben
    # beide dokumentierten Wege unveraendert erreichbar; vom Laptop aus
    # braucht ein Datenbankwerkzeug jetzt einen SSH-Tunnel.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: vereinorder_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vereinorder}?schema=public
      # #175: Kein Vorgabewert mehr - der alte stand im oeffentlichen
      # Repository, und wer ihn kannte, konnte sich ein Token fuer jede Rolle
      # selbst ausstellen. Kein "${...:?}" mehr fuer das Worker-Token: leer
      # ist der Normalfall. Beide Werte erzeugt der Entrypoint beim ersten
      # Start unter STATE_DIR (apps/backend/docker-entrypoint.sh). Wer sie
      # selbst verwalten will, setzt sie in der .env - eine gesetzte
      # Umgebungsvariable gewinnt immer.
      JWT_SECRET: ${JWT_SECRET:-}
      PRINT_WORKER_TOKEN: ${PRINT_WORKER_TOKEN:-}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_HOURLY_KEEP: ${BACKUP_RETENTION_HOURLY_KEEP:-24}
      BACKUP_RETENTION_DAILY_KEEP: ${BACKUP_RETENTION_DAILY_KEEP:-14}
      BACKUP_RETENTION_EVENT_KEEP: ${BACKUP_RETENTION_EVENT_KEEP:-3}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-1073741824}
      # Nach einer erfolgreichen Datenbankumschaltung beendet sich das
      # Backend kontrolliert; restart: always startet es gegen der neuen
      # Datenbank wieder im weiterhin gesperrten Wartungsmodus.
      RESTORE_EXIT_AFTER_SWAP: "1"
      # Wartungsmodus (#67): Der Zustand liegt bewusst ausserhalb der
      # Datenbank, weil eine Wiederherstellung die Datenbank ersetzt - ein
      # Feld darin wuerde im gefaehrlichsten Augenblick ueberschrieben. Das
      # eigene Volume sorgt dafuer, dass der Zustand auch ein Neuanlegen des
      # Containers ueberlebt: ein Backend, das waehrend einer Wartung neu
      # aufgesetzt wird, kommt geschlossen wieder hoch, nicht offen.
      STATE_DIR: /app/state
      PORT: 3000
    volumes:
      - backup_data:/app/backups
      - state_data:/app/state
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: vereinorder_frontend
    restart: always
    # #180: Am Host unveraendert Port 80, im Container 8080. Der
    # nginx-Hauptprozess laeuft seit #180 unprivilegiert und kann keinen
    # Port unterhalb von 1024 mehr binden (apps/frontend/nginx.conf,
    # apps/frontend/Dockerfile). Fuer den Betrieb aendert sich dadurch
    # nichts: Die Anwendung bleibt unter http://<SERVER-IP>/ erreichbar.
    ports:
      - "80:8080"
    depends_on:
      - backend

  print-worker:
    build:
      context: .
      dockerfile: apps/print-worker/Dockerfile
    container_name: vereinorder_print_worker
    restart: always
    environment:
      BACKEND_URL: http://backend:3000
      # #175: Leer erlaubt. Ist nichts gesetzt, liest der Worker das vom
      # Backend erzeugte Token aus STATE_DIR (siehe volumes unten). Fehlt die
      # Datei noch - der Worker startet parallel zum Backend -, endet er mit
      # Fehlerstatus und laeuft ueber "restart: always" erneut an.
      PRINT_WORKER_TOKEN: ${PRINT_WORKER_TOKEN:-}
      PRINT_FORCE_SIMULATOR: ${PRINT_FORCE_SIMULATOR:-0}
      PRINT_POLL_INTERVAL_MS: ${PRINT_POLL_INTERVAL_MS:-2500}
      PRINT_TIMEOUT_MS: ${PRINT_TIMEOUT_MS:-5000}
      CUPS_BASE_URL: ${CUPS_BASE_URL:-http://host.docker.internal:631}
      PRINT_CUPS_POLL_MS: ${PRINT_CUPS_POLL_MS:-1000}
      PRINT_CUPS_WAIT_MS: ${PRINT_CUPS_WAIT_MS:-120000}
      STATE_DIR: /app/state
    volumes:
      # Nur lesend: Der Worker verwendet das vom Backend erzeugte Token, er
      # erzeugt keines. Zwei unabhaengig erzeugte Token waeren zwei
      # verschiedene, und der PrintWorkerGuard wuerde jede Anfrage ablehnen.
      - state_data:/app/state:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: vereinorder_postgres_data
  backup_data:
    name: vereinorder_backup_data
  state_data:
    name: vereinorder_state_data
