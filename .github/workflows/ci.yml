name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.4"

jobs:
  quality:
    name: Format, Lint, Typen, Unit-Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma Client generieren
        run: pnpm --filter @vereinorder/database run db:generate
      - name: Repository-Hygiene
        run: pnpm test:repository
      - name: Formatierung
        run: pnpm format:check
      - name: Linting
        run: pnpm lint
      - name: TypeScript-Typprüfung
        run: pnpm typecheck
      - name: Unit- und Komponententests
        run: pnpm test
      - name: Backend-, Frontend- und Worker-Build
        run: pnpm build

  postgres:
    name: PostgreSQL-Integration und Migrationen
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vereinorder_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vereinorder_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vereinorder_integration_test?schema=public
      MIGRATION_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_CONFIRMATION: VEREINORDER_TEST_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma Client generieren
        run: pnpm --filter @vereinorder/database run db:generate
      - name: PostgreSQL-Client bereitstellen
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: PostgreSQL-Werkzeuge gegen Serverversion prüfen
        run: |
          server_major="$(psql "${DATABASE_URL%%\?*}" -Atc "SHOW server_version_num" | cut -c1-2)"
          dump_major="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          restore_major="$(pg_restore --version | grep -oE '[0-9]+' | head -1)"
          test "$server_major" = "$dump_major"
          test "$server_major" = "$restore_major"
      - name: Testdatenbank verifizieren
        run: pnpm test:db-guard
      - name: Integrationstest-Schema migrieren
        run: pnpm --filter @vereinorder/database exec prisma migrate deploy
      - name: PostgreSQL-Integrationstests
        run: pnpm test:integration
      - name: Leere und ältere Datenbank migrieren
        run: pnpm test:migrations

  e2e:
    name: Browser-Smoke admin und kellner1
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vereinorder_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vereinorder_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vereinorder_e2e_test?schema=public
      TEST_DATABASE_CONFIRMATION: VEREINORDER_TEST_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma Client generieren
        run: pnpm --filter @vereinorder/database run db:generate
      - name: Testdatenbank verifizieren
        run: pnpm test:db-guard
      - name: Schema und synthetische Rollen anlegen
        run: |
          pnpm --filter @vereinorder/database exec prisma migrate deploy
          pnpm --filter @vereinorder/database exec prisma db seed
      - name: Chromium installieren
        run: pnpm playwright:install --with-deps
      - name: Ephemere Testgeheimnisse erzeugen
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PRINT_WORKER_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Rollen-Smoke in drei Viewports
        run: pnpm test:e2e
      - name: Browser-Artefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  docker:
    name: Docker ${{ matrix.component }} ${{ matrix.platform }}
    # Die Zielplattform bestimmt den Runner: jeder Job baut nativ. Unter
    # QEMU-Emulation stuerzte "pnpm install" fuer arm64 mit einer Illegal
    # Instruction ab, und die Builds dauerten ein Vielfaches.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, print-worker]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.component == 'backend' }}
          outputs: ${{ matrix.component != 'backend' && 'type=cacheonly' || '' }}
          tags: vereinorder-ci-${{ matrix.component }}:${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.platform }}
      - name: PostgreSQL-Werkzeuge im Backend-Image prüfen
        if: matrix.component == 'backend'
        run: |
          image="vereinorder-ci-backend:${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}"
          test "$(docker run --rm "$image" pg_dump --version | grep -oE '[0-9]+' | head -1)" = "16"
          test "$(docker run --rm "$image" pg_restore --version | grep -oE '[0-9]+' | head -1)" = "16"

  docker-compose-migration:
    name: Docker-Bündel Migrationsstart
    runs-on: ubuntu-latest
    # Der Auftrag "docker" oben baut die Abbilder nur einzeln und prueft
    # darin lediglich die PostgreSQL-Werkzeuge. Dieser Auftrag faehrt das
    # gesamte Buendel wie im Festbetrieb hoch (#172) und belegt, dass
    # "docker compose up -d" tatsaechlich ein migriertes Schema und ein
    # antwortendes Backend ergibt - vorher blieb die Datenbank leer (B20 in
    # docs/development/datensicherung.md:930).
    #
    # Bewusst nur amd64 und keine Matrix: ubuntu-latest-Runner sind x86_64,
    # das Abbild selbst wird bereits im Auftrag "docker" fuer amd64 UND
    # arm64 gebaut und geprueft. Ein zweiter, hier nachgebauter arm64-Lauf
    # wuerde nur denselben Compose-Ablauf ein zweites Mal ausfuehren, ohne
    # eine neue Aussage ueber die Migration selbst zu liefern - unnoetiger
    # Ressourcenverbrauch fuer diesen Auftrag.
    #
    # Abweichung vom Umfang in #172: Dort wird zusaetzlich verlangt, den
    # Anmeldeablauf aus #173 (Setup-Wizard, erster Administrator) bis zur
    # erfolgreichen Anmeldung durchzuspielen. #173 ist zum Zeitpunkt dieser
    # Aenderung noch nicht umgesetzt - es gibt weder einen Setup-Endpunkt
    # noch einen anmeldbaren Benutzer. Dieser Auftrag prueft deshalb nur
    # Migration und Erreichbarkeit; sobald #173 steht, gehoert hier ein
    # weiterer Schritt hin, der den Setup-Endpunkt aufruft und sich
    # anschliessend mit dem angelegten Administrator anmeldet.
    steps:
      - uses: actions/checkout@v4
      # Seit #175 werden hier BEWUSST keine Geheimnisse mehr gesetzt. Genau
      # das ist die Zusage: "docker compose up -d" laeuft ohne .env und ohne
      # gesetzte Variablen durch. Vorher erzwang docker-compose.yml
      # PRINT_WORKER_TOKEN ueber "${...:?}" und brach sofort ab, und
      # JWT_SECRET fiel auf einen im Repository stehenden Wert zurueck.
      - name: Bündel bauen und hochfahren (ohne .env, ohne gesetzte Geheimnisse)
        run: docker compose up -d --build
      - name: Auf migriertes, antwortendes Backend warten
        run: |
          status=000
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://127.0.0.1:3000/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"ci-docker-smoke-check","pin":"0000"}') || status=000
            # 401 heisst: Das Backend antwortet, die Tabelle "User" existiert
            # und wurde erfolgreich abgefragt - nur eben kein solcher
            # Benutzer gefunden. Vor der Migration lieferte derselbe Aufruf
            # 500 (PrismaClientKnownRequestError: relation does not exist),
            # siehe #172.
            if [ "$status" = "401" ]; then
              echo "Backend antwortet mit 401 - Schema ist vorhanden."
              break
            fi
            sleep 2
          done
          if [ "$status" != "401" ]; then
            echo "Backend antwortet nicht wie erwartet (letzter Status: $status)." >&2
            docker compose logs
            exit 1
          fi
      - name: Migrationsstand im Container prüfen
        run: docker compose exec -T backend pnpm --filter @vereinorder/database exec prisma migrate status
      - name: Tabellen in PostgreSQL prüfen
        run: |
          count=$(docker compose exec -T postgres psql -U postgres -d vereinorder -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "Öffentliche Tabellen nach der Migration: $count"
          test "$count" -gt 0
      - name: Erzeugte Geheimnisse prüfen (#175)
        run: |
          for file in jwt-secret print-worker-token; do
            mode=$(docker compose exec -T backend stat -c '%a' "/app/state/$file")
            echo "/app/state/$file hat Dateirechte $mode"
            test "$mode" = "600"
          done
          # Das Protokoll haelt fest, DASS erzeugt wurde - nicht welcher Wert.
          docker compose logs backend | grep -q "wurde beim ersten Start neu erzeugt"
          secret=$(docker compose exec -T backend cat /app/state/jwt-secret)
          test -n "$secret"
          docker compose logs | grep -q -- "$secret" && {
            echo "Der erzeugte Schluessel steht im Protokoll." >&2
            exit 1
          }
          echo "$secret" > /tmp/jwt-secret-vor-neustart
      - name: Zweiter Start verwendet denselben Schlüssel (#175)
        run: |
          # Container neu anlegen, nicht nur neu starten: Der Schluessel
          # liegt auf dem Volume vereinorder_state_data und muss genau das
          # ueberleben. Bliebe er nicht gleich, waere jedes ausgegebene
          # Token nach einem Update ungueltig.
          docker compose up -d --force-recreate --no-deps backend
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST               http://127.0.0.1:3000/auth/login               -H 'Content-Type: application/json'               -d '{"username":"ci-docker-smoke-check","pin":"0000"}') || status=000
            [ "$status" = "401" ] && break
            sleep 2
          done
          docker compose exec -T backend cat /app/state/jwt-secret > /tmp/jwt-secret-nach-neustart
          diff /tmp/jwt-secret-vor-neustart /tmp/jwt-secret-nach-neustart
      - name: Print-Worker hat dasselbe Token wie das Backend (#175)
        run: |
          # Der Worker hat kein eigenes Geheimnis, sondern liest die Datei
          # des Backends ueber dasselbe Volume (nur lesend eingehaengt).
          backend_token=$(docker compose exec -T backend cat /app/state/print-worker-token)
          worker_token=$(docker compose exec -T print-worker cat /app/state/print-worker-token)
          test "$backend_token" = "$worker_token"
          test "$(docker compose ps --status running --services | grep -c '^print-worker$')" = "1"
      - name: Bündelprotokolle bei Fehlschlag sichern
        if: failure()
        run: docker compose logs
      - name: Bündel abbauen
        if: always()
        run: docker compose down -v

  secrets:
    name: Geheimnisprüfung
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
