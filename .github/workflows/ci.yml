name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      run: pnpm --filter @vereinorder/database exec prisma generate

    - name: Build Database Package
      run: pnpm --filter @vereinorder/database run build

    - name: Build Backend
      run: pnpm --filter @vereinorder/backend run build

    - name: Build Frontend
      run: pnpm --filter @vereinorder/frontend run build
