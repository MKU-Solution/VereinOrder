name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.4"

jobs:
  quality:
    name: Format, Lint, Typen, Unit-Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma Client generieren
        run: pnpm --filter @vereinorder/database run db:generate
      - name: Repository-Hygiene
        run: pnpm test:repository
      - name: Formatierung
        run: pnpm format:check
      - name: Linting
        run: pnpm lint
      - name: TypeScript-Typprüfung
        run: pnpm typecheck
      - name: Unit- und Komponententests
        run: pnpm test
      - name: Backend-, Frontend- und Worker-Build
        run: pnpm build

  postgres:
    name: PostgreSQL-Integration und Migrationen
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vereinorder_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vereinorder_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vereinorder_integration_test?schema=public
      MIGRATION_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_CONFIRMATION: VEREINORDER_TEST_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma Client generieren
        run: pnpm --filter @vereinorder/database run db:generate
      - name: PostgreSQL-Client bereitstellen
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: PostgreSQL-Werkzeuge gegen Serverversion prüfen
        run: |
          server_major="$(psql "${DATABASE_URL%%\?*}" -Atc "SHOW server_version_num" | cut -c1-2)"
          dump_major="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          restore_major="$(pg_restore --version | grep -oE '[0-9]+' | head -1)"
          test "$server_major" = "$dump_major"
          test "$server_major" = "$restore_major"
      - name: Testdatenbank verifizieren
        run: pnpm test:db-guard
      - name: Integrationstest-Schema migrieren
        run: pnpm --filter @vereinorder/database exec prisma migrate deploy
      - name: PostgreSQL-Integrationstests
        run: pnpm test:integration
      - name: Leere und ältere Datenbank migrieren
        run: pnpm test:migrations

  e2e:
    name: Browser-Smoke admin und kellner1
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vereinorder_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vereinorder_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vereinorder_e2e_test?schema=public
      TEST_DATABASE_CONFIRMATION: VEREINORDER_TEST_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma Client generieren
        run: pnpm --filter @vereinorder/database run db:generate
      - name: Testdatenbank verifizieren
        run: pnpm test:db-guard
      - name: Schema und synthetische Rollen anlegen
        run: |
          pnpm --filter @vereinorder/database exec prisma migrate deploy
          pnpm --filter @vereinorder/database exec prisma db seed
      - name: Chromium installieren
        run: pnpm playwright:install --with-deps
      - name: Ephemere Testgeheimnisse erzeugen
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PRINT_WORKER_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Rollen-Smoke in drei Viewports
        run: pnpm test:e2e
      - name: Browser-Artefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  docker:
    name: Docker ${{ matrix.component }} ${{ matrix.platform }}
    # Die Zielplattform bestimmt den Runner: jeder Job baut nativ. Unter
    # QEMU-Emulation stuerzte "pnpm install" fuer arm64 mit einer Illegal
    # Instruction ab, und die Builds dauerten ein Vielfaches.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, print-worker]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.component == 'backend' }}
          outputs: ${{ matrix.component != 'backend' && 'type=cacheonly' || '' }}
          tags: vereinorder-ci-${{ matrix.component }}:${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.platform }}
      - name: PostgreSQL-Werkzeuge im Backend-Image prüfen
        if: matrix.component == 'backend'
        run: |
          image="vereinorder-ci-backend:${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}"
          test "$(docker run --rm "$image" pg_dump --version | grep -oE '[0-9]+' | head -1)" = "16"
          test "$(docker run --rm "$image" pg_restore --version | grep -oE '[0-9]+' | head -1)" = "16"

  docker-compose-migration:
    name: Docker-Bündel Migrationsstart
    runs-on: ubuntu-latest
    # Der Auftrag "docker" oben baut die Abbilder nur einzeln und prueft
    # darin lediglich die PostgreSQL-Werkzeuge. Dieser Auftrag faehrt das
    # gesamte Buendel wie im Festbetrieb hoch (#172) und belegt, dass
    # "docker compose up -d" tatsaechlich ein migriertes Schema und ein
    # antwortendes Backend ergibt - vorher blieb die Datenbank leer (B20 in
    # docs/development/datensicherung.md:930).
    #
    # Bewusst nur amd64 und keine Matrix: ubuntu-latest-Runner sind x86_64,
    # das Abbild selbst wird bereits im Auftrag "docker" fuer amd64 UND
    # arm64 gebaut und geprueft. Ein zweiter, hier nachgebauter arm64-Lauf
    # wuerde nur denselben Compose-Ablauf ein zweites Mal ausfuehren, ohne
    # eine neue Aussage ueber die Migration selbst zu liefern - unnoetiger
    # Ressourcenverbrauch fuer diesen Auftrag.
    steps:
      - uses: actions/checkout@v4
      # Seit #175 werden hier BEWUSST keine Geheimnisse mehr gesetzt. Genau
      # das ist die Zusage: "docker compose up -d" laeuft ohne .env und ohne
      # gesetzte Variablen durch. Vorher erzwang docker-compose.yml
      # PRINT_WORKER_TOKEN ueber "${...:?}" und brach sofort ab, und
      # JWT_SECRET fiel auf einen im Repository stehenden Wert zurueck.
      - name: Bündel bauen und hochfahren (ohne .env, ohne gesetzte Geheimnisse)
        run: docker compose up -d --build
      - name: Auf migriertes Backend warten und ausstehende Ersteinrichtung belegen
        run: |
          set -euo pipefail
          # GET /setup/status zaehlt die Tabelle "User" (SetupService.getStatus).
          # Vor der Migration liefert das 500 (PrismaClientKnownRequestError:
          # relation does not exist, siehe #172), danach 200. Der Aufruf
          # ersetzt den frueheren Umweg ueber ein erfundenes Login
          # ("ci-docker-smoke-check" / 401 als Schema-Beleg) - er dient
          # zugleich als Warteschleife UND liefert direkt die erste Aussage
          # von #192: die Ersteinrichtung ist auf einem frischen Buendel
          # als ausstehend gemeldet.
          status=000
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:3000/setup/status) || status=000
            if [ "$status" = "200" ]; then
              echo "Backend antwortet mit 200 - Schema ist vorhanden."
              break
            fi
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "Backend antwortet nicht wie erwartet (letzter Status: $status)." >&2
            docker compose logs
            exit 1
          fi
          body=$(curl -s http://127.0.0.1:3000/setup/status)
          echo "GET /setup/status (vor der Ersteinrichtung): $body"
          echo "$body" | grep -q '"setupRequired":true'
      - name: Migrationsstand im Container prüfen
        run: docker compose exec -T backend pnpm --filter @vereinorder/database exec prisma migrate status
      - name: Tabellen in PostgreSQL prüfen
        run: |
          count=$(docker compose exec -T postgres psql -U postgres -d vereinorder -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "Öffentliche Tabellen nach der Migration: $count"
          test "$count" -gt 0
      - name: Administrator über die Ersteinrichtung anlegen
        run: |
          set -euo pipefail
          # Erzeugte Werte statt Literale aus einer Beispieldatei: Sonst
          # pruefte dieser Schritt nur, dass EIN bestimmter String die
          # Validierung besteht, nicht dass die Ersteinrichtung selbst
          # funktioniert. username/pin muessen dieselbe Regel wie
          # AuthService.validateUser erfuellen (setup.dto.ts importiert
          # PIN_PATTERN direkt aus users.dto.ts) - genau der Fallstrick, den
          # setup.dto.ts im Kommentar beschreibt: ein hier abweichendes
          # Muster ergaebe ein Konto, das angelegt werden kann, sich aber
          # nie anmelden kann.
          admin_user="ci-setup-admin-${{ github.run_id }}-${{ github.run_attempt }}"
          admin_pin=$(printf '%06d' "$RANDOM")
          echo "::add-mask::$admin_pin"

          http_code=$(curl -s -o /tmp/setup-admin-response.json -w '%{http_code}' -X POST \
            http://127.0.0.1:3000/setup/admin \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$admin_user\",\"pin\":\"$admin_pin\"}")
          echo "POST /setup/admin antwortet mit $http_code"
          if [ "$http_code" != "201" ]; then
            echo "Erwartete 201, siehe Antwort:" >&2
            cat /tmp/setup-admin-response.json >&2
            exit 1
          fi

          # Die Antwort (SetupController.createAdministrator) enthaelt
          # bewusst KEINEN PIN-Hash - kein Geheimnis, das hier gedruckt
          # werden duerfte.
          cat /tmp/setup-admin-response.json
          grep -q "\"username\":\"$admin_user\"" /tmp/setup-admin-response.json
          grep -q '"role":"ADMINISTRATOR"' /tmp/setup-admin-response.json
          grep -q '"isActive":true' /tmp/setup-admin-response.json
          if grep -q "pinHash" /tmp/setup-admin-response.json; then
            echo "Antwort enthält einen PIN-Hash, der dort nicht stehen darf." >&2
            exit 1
          fi
          rm -f /tmp/setup-admin-response.json

          echo "SETUP_ADMIN_USERNAME=$admin_user" >> "$GITHUB_ENV"
          echo "SETUP_ADMIN_PIN=$admin_pin" >> "$GITHUB_ENV"
      - name: Abgeschlossene Ersteinrichtung über setup/status belegen
        run: |
          set -euo pipefail
          body=$(curl -s http://127.0.0.1:3000/setup/status)
          echo "GET /setup/status (nach der Ersteinrichtung): $body"
          echo "$body" | grep -q '"setupRequired":false'
      - name: Anmeldung mit dem angelegten Administrator (eigentliche Aussage dieses Auftrags)
        run: |
          set -euo pipefail
          http_code=$(curl -s -o /tmp/auth-login-response.json -w '%{http_code}' -X POST \
            http://127.0.0.1:3000/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$SETUP_ADMIN_USERNAME\",\"pin\":\"$SETUP_ADMIN_PIN\"}")
          echo "POST /auth/login antwortet mit $http_code"
          if [ "$http_code" != "200" ]; then
            echo "Erwartete 200, siehe Antwort:" >&2
            cat /tmp/auth-login-response.json >&2
            exit 1
          fi

          # access_token nicht drucken - nur belegen, dass eines da ist, und
          # fuer den Neustart-Schritt unten sichern (#175: dort wird
          # geprueft, dass ein VOR dem Neuanlegen ausgestelltes Token danach
          # noch gilt).
          token=$(grep -o '"access_token":"[^"]*"' /tmp/auth-login-response.json | cut -d'"' -f4)
          rm -f /tmp/auth-login-response.json
          if [ -z "$token" ]; then
            echo "Antwort auf POST /auth/login enthielt trotz Status 200 kein access_token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "$token" > /tmp/setup-admin-token-vor-neustart
      - name: Erzeugte Geheimnisse prüfen (#175)
        run: |
          for file in jwt-secret print-worker-token; do
            mode=$(docker compose exec -T backend stat -c '%a' "/app/state/$file")
            echo "/app/state/$file hat Dateirechte $mode"
            test "$mode" = "600"
          done
          # Das Protokoll haelt fest, DASS erzeugt wurde - nicht welcher Wert.
          docker compose logs backend | grep -q "wurde beim ersten Start neu erzeugt"
          secret=$(docker compose exec -T backend cat /app/state/jwt-secret)
          test -n "$secret"
          docker compose logs | grep -q -- "$secret" && {
            echo "Der erzeugte Schluessel steht im Protokoll." >&2
            exit 1
          }
          # printf statt echo: "$secret" kommt aus einer Kommandosubstitution
          # und traegt deshalb nie einen abschliessenden Zeilenumbruch,
          # gleich ob die Datei selbst einen hatte oder nicht (ensure-
          # secrets.ts schreibt den Wert ohne Zeilenumbruch). "echo" wuerde
          # hier einen hinzufuegen, den "cat" beim naechsten Start (Schritt
          # "Zweiter Start verwendet denselben Schluessel") NICHT mitbringt -
          # der folgende byteweise Vergleich schluege dann JEDES Mal fehl,
          # unabhaengig davon, ob der Schluessel wirklich gleich ist.
          printf '%s' "$secret" > /tmp/jwt-secret-vor-neustart
      - name: Zweiter Start verwendet denselben Schlüssel (#175)
        run: |
          set -euo pipefail
          # Container neu anlegen, nicht nur neu starten: Der Schluessel
          # liegt auf dem Volume vereinorder_state_data und muss genau das
          # ueberleben. Bliebe er nicht gleich, waere jedes ausgegebene
          # Token nach einem Update ungueltig.
          docker compose up -d --force-recreate --no-deps backend
          status=000
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://127.0.0.1:3000/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"ci-docker-smoke-check","pin":"0000"}') || status=000
            [ "$status" = "401" ] && break
            sleep 2
          done
          if [ "$status" != "401" ]; then
            echo "Backend antwortet nach dem Neuanlegen nicht wie erwartet (letzter Status: $status)." >&2
            docker compose logs backend
            exit 1
          fi

          docker compose exec -T backend cat /app/state/jwt-secret > /tmp/jwt-secret-nach-neustart
          diff /tmp/jwt-secret-vor-neustart /tmp/jwt-secret-nach-neustart

          # Staerkere, verhaltensbezogene Aussage zum Dateivergleich oben:
          # Der Dateivergleich zeigt nur, dass zwei Dateien byteweise
          # gleich sind. Die eigentliche Zusage aus #175 ist, dass ein VOR
          # dem Neuanlegen des Containers mit dem alten Schluessel
          # ausgestelltes Token danach noch gilt. /users ist bewusst
          # gewaehlt: Der Weg verlangt JwtAuthGuard UND
          # RolesGuard("ADMINISTRATOR") (users.controller.ts) - das Token
          # muss also nicht nur signiert, sondern mit der richtigen Rolle
          # ausgestellt sein, damit dieser Aufruf 200 statt 401/403 liefert.
          token=$(cat /tmp/setup-admin-token-vor-neustart)
          users_status=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3000/users \
            -H "Authorization: Bearer $token")
          echo "GET /users mit dem Token von vor dem Neuanlegen: $users_status"
          test "$users_status" = "200"
          rm -f /tmp/jwt-secret-vor-neustart /tmp/jwt-secret-nach-neustart /tmp/setup-admin-token-vor-neustart
      - name: Print-Worker hat dasselbe Token wie das Backend (#175)
        run: |
          # Der Worker hat kein eigenes Geheimnis, sondern liest die Datei
          # des Backends ueber dasselbe Volume (nur lesend eingehaengt).
          backend_token=$(docker compose exec -T backend cat /app/state/print-worker-token)
          worker_token=$(docker compose exec -T print-worker cat /app/state/print-worker-token)
          test "$backend_token" = "$worker_token"
          test "$(docker compose ps --status running --services | grep -c '^print-worker$')" = "1"
      - name: Bündelprotokolle bei Fehlschlag sichern
        if: failure()
        run: docker compose logs
      - name: Bündel abbauen
        if: always()
        run: docker compose down -v

  docker-compose-upgrade:
    name: Docker-Bündel Aktualisierung (upgrade.sh, PRE_MIGRATION vor Migration)
    runs-on: ubuntu-latest
    # Der Auftrag "docker-compose-migration" oben fährt nur ein LEERES Bündel
    # hoch (Ersteinrichtung, aber keine spätere Aktualisierung). Genau das
    # war die Lücke hinter #199: Kein Auftrag hat je ein BEFÜLLTES System
    # über "scripts/ops/upgrade.sh" aktualisiert, deshalb blieb unbemerkt,
    # dass der bis dahin dokumentierte Ablauf (Neubau vor Sicherung, siehe
    # der frühere Wortlaut von docs/ops/raspberry-pi-setup.md) die
    # PRE_MIGRATION-Sicherung erst NACH der automatischen Migration im
    # Entrypoint anlegte. Dieser Auftrag richtet ein befülltes System ein,
    # erzeugt eine harmlose zusätzliche Migration (eine Wegwerftabelle) und
    # belegt über das Sicherungsmanifest, dass "upgrade.sh" die
    # PRE_MIGRATION-Sicherung VOR dieser neuen Migration anlegt - nicht über
    # einen Zeitstempelvergleich, sondern direkt: Jedes Sicherungsmanifest
    # trägt die Liste der zum Sicherungszeitpunkt bereits angewendeten
    # Migrationen (native-backup.service.ts, "migrations: before.migrations"
    # - dieselbe Momentaufnahme, aus der auch "prisma migrate status"
    # schöpft). Fehlt die Wegwerfmigration in dieser Liste, stand der Dump
    # nachweislich vor ihrer Anwendung.
    steps:
      - uses: actions/checkout@v4
      - name: Bündel bauen und hochfahren (Ersteinrichtung folgt, wie im Auftrag oben)
        run: docker compose up -d --build
      - name: Auf migriertes Backend warten
        run: |
          set -euo pipefail
          status=000
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:3000/setup/status) || status=000
            [ "$status" = "200" ] && break
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "Backend antwortet nicht wie erwartet (letzter Status: $status)." >&2
            docker compose logs
            exit 1
          fi
      - name: Administrator über die Ersteinrichtung anlegen
        run: |
          set -euo pipefail
          admin_user="ci-upgrade-admin-${{ github.run_id }}-${{ github.run_attempt }}"
          admin_pin=$(printf '%06d' "$RANDOM")
          echo "::add-mask::$admin_pin"
          http_code=$(curl -s -o /tmp/setup-admin-response.json -w '%{http_code}' -X POST \
            http://127.0.0.1:3000/setup/admin \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$admin_user\",\"pin\":\"$admin_pin\"}")
          if [ "$http_code" != "201" ]; then
            echo "POST /setup/admin antwortet mit $http_code statt 201:" >&2
            cat /tmp/setup-admin-response.json >&2
            exit 1
          fi
          rm -f /tmp/setup-admin-response.json
          echo "SETUP_ADMIN_USERNAME=$admin_user" >> "$GITHUB_ENV"
          echo "SETUP_ADMIN_PIN=$admin_pin" >> "$GITHUB_ENV"
      - name: Anmelden und ADMIN_TOKEN erzeugen - VOR dem Aufruf von upgrade.sh, wie jetzt dokumentiert
        run: |
          set -euo pipefail
          http_code=$(curl -s -o /tmp/login-response.json -w '%{http_code}' -X POST \
            http://127.0.0.1:3000/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$SETUP_ADMIN_USERNAME\",\"pin\":\"$SETUP_ADMIN_PIN\"}")
          if [ "$http_code" != "200" ]; then
            echo "POST /auth/login antwortet mit $http_code statt 200:" >&2
            cat /tmp/login-response.json >&2
            exit 1
          fi
          token=$(grep -o '"access_token":"[^"]*"' /tmp/login-response.json | cut -d'"' -f4)
          rm -f /tmp/login-response.json
          if [ -z "$token" ]; then
            echo "Antwort auf POST /auth/login enthielt trotz Status 200 kein access_token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Testdaten anlegen (befülltes System statt leerem Bündel)
        run: |
          set -euo pipefail
          http_code=$(curl -s -o /tmp/users-response.json -w '%{http_code}' -X POST \
            http://127.0.0.1:3000/users \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' \
            -d '{"username":"ci-upgrade-kellner1","pin":"123456","role":"WAITER"}')
          if [ "$http_code" != "201" ]; then
            echo "POST /users antwortet mit $http_code statt 201:" >&2
            cat /tmp/users-response.json >&2
            exit 1
          fi
          rm -f /tmp/users-response.json
      - name: Wegwerfmigration erzeugen (etwas, das ausstehen kann)
        run: |
          set -euo pipefail
          dir="packages/database/prisma/migrations/20260830999999_ci_upgrade_probe"
          mkdir -p "$dir"
          cat > "$dir/migration.sql" <<'EOF'
          -- Wegwerfmigration nur fuer den CI-Nachweis von Issue #199.
          CREATE TABLE "ci_upgrade_probe" (
              "id" SERIAL PRIMARY KEY
          );
          EOF
      - name: scripts/ops/upgrade.sh ausführen (eigentliche Aussage dieses Auftrags)
        run: ./scripts/ops/upgrade.sh
      - name: Beleg A - PRE_MIGRATION-Sicherung enthält die Wegwerfmigration NICHT
        run: |
          set -euo pipefail
          manifest_name=$(docker compose exec -T backend sh -c \
            'ls -t /app/backups/*premigration*.manifest.json 2>/dev/null | head -1')
          echo "Gefundenes Manifest: $manifest_name"
          docker compose exec -T backend cat "$manifest_name" > /tmp/premigration-manifest.json
          if grep -q "20260830999999_ci_upgrade_probe" /tmp/premigration-manifest.json; then
            echo "PRE_MIGRATION-Sicherung enthält die neue Migration bereits - #199 nicht behoben." >&2
            cat /tmp/premigration-manifest.json >&2
            exit 1
          fi
          echo "Migrationen im PRE_MIGRATION-Manifest laut 'migrations'-Feld:"
          grep -o '"name":"[^"]*"' /tmp/premigration-manifest.json | tail -3
          rm -f /tmp/premigration-manifest.json
      - name: Beleg B - die neue Migration ist NACH dem Update tatsächlich angewendet
        run: |
          set -euo pipefail
          docker compose exec -T backend pnpm --filter @vereinorder/database exec prisma migrate status \
            | tee /tmp/migrate-status.log
          grep -q "Database schema is up to date" /tmp/migrate-status.log
          count=$(docker compose exec -T postgres psql -U postgres -d vereinorder -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_name='ci_upgrade_probe'")
          echo "Wegwerftabelle in PostgreSQL vorhanden: $count"
          test "$count" = "1"
      - name: Beleg C - befülltes System blieb erhalten, Wartungsmodus wieder OPEN
        run: |
          set -euo pipefail
          users_count=$(curl -s http://127.0.0.1:3000/users -H "Authorization: Bearer $ADMIN_TOKEN" \
            | grep -o '"username"' | wc -l)
          echo "Benutzer nach dem Update: $users_count"
          test "$users_count" -ge 2
          phase=$(curl -s http://127.0.0.1:3000/maintenance | jq -r '.phase')
          echo "Wartungsphase nach dem Update: $phase"
          test "$phase" = "OPEN"
      - name: Bündelprotokolle bei Fehlschlag sichern
        if: failure()
        run: docker compose logs
      - name: Bündel abbauen
        if: always()
        run: docker compose down -v

  secrets:
    name: Geheimnisprüfung
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
