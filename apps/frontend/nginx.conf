server {
    # #180: 8080 statt 80. Der nginx-Hauptprozess laeuft seit #180
    # unprivilegiert (apps/frontend/Dockerfile, USER nginx) und kann keinen
    # Port unterhalb von 1024 mehr binden. Am Host aendert sich nichts:
    # docker-compose.yml bildet weiterhin den Host-Port 80 auf diesen
    # Containerport ab. Wer diese Zeile aendert, muss die Abbildung dort
    # mitziehen.
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Backend
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # #186: Ohne diese Zeile gilt nginx' eigene Vorgabe von 60s, die fuer
        # die Sicherungs- und Wiederherstellungswege zu kurz ist - POST
        # /backup/create, /backup/verify-restore/:filename (spielt den Dump
        # vollstaendig in eine Nebendatenbank ein und vergleicht ihn),
        # /backup/native-restore/:filename, /backup/restore-operation/:action,
        # /backup/restore/:filename und GET /backup/download/:filename laufen
        # alle ueber diesen Pfad. Der Wert hier ist an
        # apps/backend/src/backup/postgresql-backup.tools.ts
        # (RESTORE_TIMEOUT_MS, MIGRATION_TIMEOUT_MS: bis zu 30 Minuten) UND an
        # apps/frontend/src/components/admin/AdminDashboardController.tsx
        # (BACKUP_REQUEST_TIMEOUT_MS) GEBUNDEN - bleibt er hier kleiner, kappt
        # nginx die Verbindung, bevor der Browser aufgibt. Alle anderen
        # Aufrufe ueber /api/ brechen weiterhin nach den 15s der Axios-Instanz
        # ab (apps/frontend/src/lib/api.ts) und sind von diesem hohen Wert
        # unberuehrt.
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }

    # Realtime SSE stream proxy
    location /realtime/ {
        proxy_pass http://backend:3000/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # #186: proxy_buffering off schaltet dieses Zeitlimit NICHT ab - ohne
        # eigenen Herzschlag wuerde eine Ruhephase laenger als dieser Wert die
        # Verbindung zum Backend stumm beenden, und der Browser baute im Takt
        # der Ruhephasen dauerhaft neu auf. Der Wert hier ist an
        # apps/backend/src/realtime/realtime.service.ts
        # (REALTIME_HEARTBEAT_INTERVAL_MS, 20s) GEBUNDEN und muss deutlich
        # darueber bleiben, nicht nur knapp: aendert sich einer, muss der
        # andere nachgezogen werden.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
