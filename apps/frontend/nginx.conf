server {
    # #180: 8080 statt 80. Der nginx-Hauptprozess laeuft seit #180
    # unprivilegiert (apps/frontend/Dockerfile, USER nginx) und kann keinen
    # Port unterhalb von 1024 mehr binden. Am Host aendert sich nichts:
    # docker-compose.yml bildet weiterhin den Host-Port 80 auf diesen
    # Containerport ab. Wer diese Zeile aendert, muss die Abbildung dort
    # mitziehen.
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # #179: Ohne eigene Vorgabe schickt nginx nur Last-Modified und ETag -
    # ein Browser darf eine solche Antwort dann nach eigener Schaetzung
    # wiederverwenden, OHNE beim Server nachzufragen. Das ist bei den
    # gestempelten Dateien erwuenscht (Inhaltsstempel im Namen: assets/*
    # sowie die workbox-*.js von vite-plugin-pwa, siehe unten) - ein
    # geaenderter Inhalt erzeugt ohnehin einen neuen Namen, darum lange
    # Gueltigkeit und "immutable". Bei den folgenden Dateien OHNE Stempel
    # ist das gefaehrlich: eine veraltete index.html verweist auf ein
    # Bundle, das laengst ersetzt wurde, und ein Browser haette ohne
    # Rueckfrage keinen Grund, das je zu bemerken - das Geraet bleibt auf
    # altem Stand, ohne dass irgendwo ein Fehler erscheint. Darum hier
    # "no-cache, must-revalidate": der Inhalt darf zwischengespeichert
    # werden, aber nur mit Bestaetigung durch den Server (per ETag).
    #
    # Das widerspricht NICHT dem Offlinebetrieb
    # (docs/development/offline-warteschlange.md): Die Offlinefaehigkeit
    # kommt aus dem Vorrat des Service Workers (Workbox-Precache), nicht
    # aus dem HTTP-Cache. Eine Vorgabe, die eine Rueckfrage beim Server
    # erzwingt, betrifft nur den Fall, dass der Server ueberhaupt
    # erreichbar ist - ist er es nicht, beantwortet der Service Worker die
    # Anfrage aus seinem eigenen Vorrat, bevor sie das Netz erreicht. Wer
    # aus Sorge um den Offlinebetrieb diese Regel wieder abschaltet, oeffnet
    # erneut genau das Problem, das sie loest.
    #
    # Die Dateinamen unten sind am tatsaechlichen Bauergebnis abgelesen
    # (pnpm --filter @vereinorder/frontend run build, #179), nicht vermutet.
    # Legt ein kuenftiger Bau eine weitere ungestempelte Datei ab, an die
    # hier niemand gedacht hat, greift keine dieser Regeln, und sie faellt
    # unter die allgemeine location / oben - also wieder ohne
    # Cache-Vorgabe. Das faengt scripts/ci/check-frontend-cache-rules.mjs
    # (test:frontend-cache, in der CI-Qualitaetsaufgabe unmittelbar nach
    # 'pnpm build'): das Skript liest das tatsaechliche Bauergebnis unter
    # apps/frontend/dist und verlangt fuer jede darin gefundene ungestempelte
    # Datei, dass diese Datei hier namentlich in einer location-Regel
    # auftaucht - ohne eine zweite, separat gepflegte Liste zu benoetigen
    # und ohne die nginx-Syntax im Detail zu verstehen.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Gestempelte Dateien: assets/* traegt den Inhaltsstempel im Vite-
    # Dateinamen (index-<Hash>.js/.css). workbox-<Hash>.js kommt von
    # vite-plugin-pwa, traegt denselben Hash-Aufbau, liegt aber ausserhalb
    # von assets/ - ohne diese zweite Regel wuerde diese Datei mangels
    # Treffer unter die allgemeine location / fallen und liefe ohne
    # Cache-Vorgabe, obwohl sie ebenso gestempelt ist.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/workbox-[^/]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API Proxy to Backend
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # #186: Ohne diese Zeile gilt nginx' eigene Vorgabe von 60s, die fuer
        # die Sicherungs- und Wiederherstellungswege zu kurz ist - POST
        # /backup/create, /backup/verify-restore/:filename (spielt den Dump
        # vollstaendig in eine Nebendatenbank ein und vergleicht ihn),
        # /backup/native-restore/:filename, /backup/restore-operation/:action,
        # /backup/restore/:filename und GET /backup/download/:filename laufen
        # alle ueber diesen Pfad. Der Wert hier ist an
        # apps/backend/src/backup/postgresql-backup.tools.ts
        # (RESTORE_TIMEOUT_MS, MIGRATION_TIMEOUT_MS: bis zu 30 Minuten) UND an
        # apps/frontend/src/components/admin/AdminDashboardController.tsx
        # (BACKUP_REQUEST_TIMEOUT_MS) GEBUNDEN - bleibt er hier kleiner, kappt
        # nginx die Verbindung, bevor der Browser aufgibt. Alle anderen
        # Aufrufe ueber /api/ brechen weiterhin nach den 15s der Axios-Instanz
        # ab (apps/frontend/src/lib/api.ts) und sind von diesem hohen Wert
        # unberuehrt.
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }

    # Realtime SSE stream proxy
    location /realtime/ {
        proxy_pass http://backend:3000/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # #186: proxy_buffering off schaltet dieses Zeitlimit NICHT ab - ohne
        # eigenen Herzschlag wuerde eine Ruhephase laenger als dieser Wert die
        # Verbindung zum Backend stumm beenden, und der Browser baute im Takt
        # der Ruhephasen dauerhaft neu auf. Der Wert hier ist an
        # apps/backend/src/realtime/realtime.service.ts
        # (REALTIME_HEARTBEAT_INTERVAL_MS, 20s) GEBUNDEN und muss deutlich
        # darueber bleiben, nicht nur knapp: aendert sich einer, muss der
        # andere nachgezogen werden.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
